<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Patient Login | MediPass</title>
  <script>
    (function() {
      const saved = localStorage.getItem('medipass_theme_pref') || 'system';
      const isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/tokens.css" />
</head>
<body class="bg-[var(--bg)] text-[var(--text)] min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[var(--surface)] border border-[var(--border)] rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-teal-600 flex items-center justify-center text-white font-extrabold text-base shadow-md shadow-teal-600/30">
          MP
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-[var(--text)]">Patient Login</h1>
          <p class="text-xs text-[var(--text-muted)]">MediPass Health Card</p>
        </div>
      </div>
      <button id="theme-btn" class="p-2 rounded-xl bg-[var(--surface-2)] text-[var(--text)] border border-[var(--border)]">
        <i data-lucide="moon" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Dev Simulated SMS OTP Banner -->
    <div id="dev-otp-banner" class="hidden p-3 rounded-2xl bg-teal-500/10 border border-teal-500/25 text-xs text-teal-800 dark:text-teal-200"></div>

    <!-- Step 1: Phone / Request OTP -->
    <div id="step-phone" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-[var(--text)] mb-1">Mobile Number</label>
        <div class="flex rounded-2xl border border-[var(--border)] bg-[var(--surface-2)] overflow-hidden focus-within:border-teal-500 transition">
          <span class="px-3.5 py-3 text-xs font-semibold text-[var(--text-muted)] bg-[var(--border)]/20 border-r border-[var(--border)]">+91</span>
          <input type="tel" id="phone-input" placeholder="9876543210" maxlength="10" class="flex-1 bg-transparent px-3 py-3 text-sm text-[var(--text)] outline-none font-medium" />
        </div>
      </div>

      <div class="flex gap-2">
        <button id="btn-send-otp" class="flex-1 py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md shadow-teal-600/30 transition">
          Get OTP
        </button>
      </div>

      <div class="pt-2 text-center">
        <span class="text-xs text-[var(--text-muted)]">Or use registered device PIN:</span>
        <div class="mt-2 flex gap-2">
          <input type="password" id="pin-input" placeholder="4-digit PIN" maxlength="6" class="flex-1 bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl px-3 py-2 text-sm text-center tracking-widest text-[var(--text)] outline-none" />
          <button id="btn-pin-login" class="px-4 py-2 rounded-2xl bg-[var(--surface-2)] hover:bg-[var(--border)] text-xs font-bold border border-[var(--border)] text-[var(--text)]">
            Login
          </button>
        </div>
      </div>
    </div>

    <!-- Step 2: Verify OTP -->
    <div id="step-otp" class="hidden space-y-4">
      <div>
        <label class="block text-xs font-bold text-[var(--text)] mb-1">Enter 6-Digit OTP</label>
        <input type="text" id="otp-input" placeholder="••••••" maxlength="6" class="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl px-4 py-3 text-lg text-center tracking-widest text-[var(--text)] outline-none font-mono focus:border-teal-500 transition" />
      </div>
      <button id="btn-verify-otp" class="w-full py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md shadow-teal-600/30 transition">
        Verify &amp; Proceed
      </button>
      <button onclick="document.getElementById('step-otp').classList.add('hidden'); document.getElementById('step-phone').classList.remove('hidden');" class="w-full text-xs text-[var(--text-muted)] hover:underline text-center">
        &larr; Back to Mobile Number
      </button>
    </div>

    <!-- Divider -->
    <div class="relative flex items-center justify-center">
      <div class="border-t border-[var(--border)] w-full"></div>
      <span class="bg-[var(--surface)] px-3 text-[11px] text-[var(--text-muted)] uppercase tracking-wider font-semibold">Or Instant Access</span>
    </div>

    <!-- Prominent "Continue as Guest" Button -->
    <button type="button" class="btn-guest-patient w-full py-3.5 px-4 rounded-2xl bg-amber-500/15 hover:bg-amber-500/25 border-2 border-amber-500/40 text-amber-800 dark:text-amber-200 transition text-left flex items-center justify-between group">
      <div>
        <div class="font-bold text-sm flex items-center gap-1.5">
          <span>👀</span>
          <span>Continue as Guest</span>
        </div>
        <p class="text-[11px] text-[var(--text-muted)]">Explore with sample data, no sign-up</p>
      </div>
      <span class="text-xs font-bold group-hover:translate-x-1 transition-transform">&rarr;</span>
    </button>

    <!-- Collapsible Demo Credentials Card with tap-to-autofill -->
    <details class="bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl p-3.5 text-xs text-[var(--text)] transition cursor-pointer">
      <summary class="font-bold select-none text-[var(--text-muted)] flex items-center justify-between">
        <span>🔑 Demo Credentials (Tap to Autofill)</span>
        <span class="text-xs">&darr;</span>
      </summary>
      <div class="mt-3 space-y-2 pt-2 border-t border-[var(--border)]">
        <button type="button" class="btn-autofill-patient w-full p-2.5 rounded-xl bg-[var(--surface)] border border-[var(--border)] hover:border-teal-500 text-left transition flex items-center justify-between" data-phone="9876543210" data-pin="1234">
          <div>
            <p class="font-bold text-xs text-[var(--text)]">Lakshmi Devi (Age 68, Telugu)</p>
            <p class="text-[10px] text-[var(--text-muted)]">Phone: 9876543210 · PIN: 1234 · Penicillin Allergy</p>
          </div>
          <span class="text-[10px] text-teal-600 font-bold bg-teal-500/10 px-2 py-0.5 rounded-md">Fill</span>
        </button>

        <button type="button" class="btn-autofill-patient w-full p-2.5 rounded-xl bg-[var(--surface)] border border-[var(--border)] hover:border-teal-500 text-left transition flex items-center justify-between" data-phone="9123456780" data-pin="5678">
          <div>
            <p class="font-bold text-xs text-[var(--text)]">Rahul Sharma (Age 34, English)</p>
            <p class="text-[10px] text-[var(--text-muted)]">Phone: 9123456780 · PIN: 5678 · Asthma Inhaler</p>
          </div>
          <span class="text-[10px] text-teal-600 font-bold bg-teal-500/10 px-2 py-0.5 rounded-md">Fill</span>
        </button>
      </div>
    </details>

    <!-- Role Switch -->
    <div class="pt-2 text-center text-xs text-[var(--text-muted)] space-y-1">
      <p>Are you a healthcare practitioner? <a href="/doctor/login.html" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">Doctor Login &rarr;</a></p>
      <p>New patient? <a href="/patient/signup.html" class="text-teal-600 dark:text-teal-400 font-bold hover:underline">Register with Mobile &rarr;</a></p>
    </div>
  </div>

  <script type="module">
    import { PatientAuth } from '/js/patient/auth.js';
    import { ThemeManager } from '/js/shared/theme.js';
    import { Icons } from '/js/shared/icons.js';

    Icons.init();
    PatientAuth.init();

    document.getElementById('theme-btn')?.addEventListener('click', () => {
      ThemeManager.toggle();
      Icons.init();
    });
  </script>
</body>
</html>
