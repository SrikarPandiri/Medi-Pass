<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediPass | Dual-Side Live Split Screen Demo</title>
  <!-- Pre-paint Theme Script -->
  <script>
    (function() {
      const saved = localStorage.getItem('medipass_theme_pref') || 'system';
      const isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/tokens.css" />
</head>
<body class="bg-[var(--bg)] text-[var(--text)] h-screen flex flex-col overflow-hidden">
  <!-- Top bar -->
  <header class="px-6 py-2.5 bg-[var(--surface)] border-b border-[var(--border)] flex items-center justify-between shadow-sm z-20">
    <div class="flex items-center gap-3">
      <a href="/" class="text-xs font-bold text-teal-600 hover:underline">&larr; Back to Landing</a>
      <span class="text-xs text-[var(--text-muted)]">|</span>
      <h1 class="text-sm font-black tracking-tight text-[var(--text)]">MediPass Split-Screen Demo Runner</h1>
    </div>
    <div class="flex items-center gap-3 text-xs">
      <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-300 font-semibold border border-amber-500/30">
        Demo Mode (Side-by-Side)
      </span>
      <button onclick="document.getElementById('patient-frame').contentWindow.location.reload(); document.getElementById('doctor-frame').contentWindow.location.reload();" class="px-3 py-1 bg-[var(--surface-2)] border border-[var(--border)] rounded-xl font-semibold hover:bg-[var(--border)] transition">
        🔄 Reload Both
      </button>
    </div>
  </header>

  <!-- Dual iframes container -->
  <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-[var(--border)] h-[calc(100vh-45px)]">
    <!-- Patient Frame (Left) -->
    <div class="flex flex-col h-full bg-[var(--bg)]">
      <div class="bg-teal-700 text-white px-4 py-1.5 text-xs font-bold flex items-center justify-between">
        <span>👤 Patient Portal (Lakshmi Devi / Asha)</span>
        <span class="text-[10px] opacity-80">Generate QR & AI Chat</span>
      </div>
      <iframe id="patient-frame" src="/patient/login.html" class="flex-1 w-full h-full border-none"></iframe>
    </div>

    <!-- Doctor Frame (Right) -->
    <div class="flex flex-col h-full bg-[var(--bg)]">
      <div class="bg-blue-700 text-white px-4 py-1.5 text-xs font-bold flex items-center justify-between">
        <span>👨‍⚕️ Doctor Clinical Terminal (Dr. Anita Rao)</span>
        <span class="text-[10px] opacity-80">Scan QR & Point-of-Care</span>
      </div>
      <iframe id="doctor-frame" src="/doctor/login.html" class="flex-1 w-full h-full border-none"></iframe>
    </div>
  </div>
</body>
</html>
